name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # No Developer ID certificate yet: sign ad hoc (required to run on Apple silicon).
      - name: Test
        run: |
          xcodebuild test -project Fenestra.xcodeproj -scheme Fenestra -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Build
        run: |
          xcodebuild build -project Fenestra.xcodeproj -scheme Fenestra -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build ARCHS=arm64 \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Package
        run: |
          # Same name in every release, so releases/latest/download/Fenestra.zip always works.
          ZIP="Fenestra.zip"
          ditto -c -k --keepParent build/Build/Products/Release/Fenestra.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: Fenestra.zip*
          if-no-files-found: error

  # Intro video of the documentation, rendered with Remotion from video/.
  video:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: video/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: video/pnpm-lock.yaml

      - name: Render
        working-directory: video
        run: |
          pnpm install --frozen-lockfile
          pnpm render

      - uses: actions/upload-artifact@v7
        with:
          name: video
          path: video/out/
          if-no-files-found: error

  publish:
    needs: [app, video]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish the release
        run: |
          VERSION="${TAG#v}"
          ZIP="Fenestra.zip"
          cat > notes.md <<EOF
          ## Install

          1. Download \`$ZIP\`, unzip it and move \`Fenestra.app\` to \`/Applications\`.
          2. This build is **not signed or notarized**, so macOS blocks it on first launch. Remove the quarantine flag:
             \`\`\`sh
             xattr -dr com.apple.quarantine /Applications/Fenestra.app
             \`\`\`
          3. Launch Fenestra and grant the Accessibility permission. Unsigned builds change identity with each version: after an update, remove the old Fenestra entry from the Accessibility list and grant it again.

          Requires macOS 26 or later on Apple silicon.
          EOF
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" fenestra-intro-* --title "Fenestra $VERSION" \
            --notes-file notes.md --generate-notes "${PRERELEASE[@]}"
