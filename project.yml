name: Fenestra
options:
  bundleIdPrefix: com.florentamaridon
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MM73SMMT5
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Fenestra:
    type: application
    platform: macOS
    sources:
      - Sources/Fenestra
      - Sources/Shared
    dependencies:
      # Command-line tool and MCP server, shipped at Contents/Helpers/fenestra.
      - target: FenestraCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Sources/Fenestra/Info.plist
      properties:
        CFBundleDisplayName: Fenestra
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florentamaridon.Fenestra
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  FenestraCLI:
    type: tool
    platform: macOS
    sources:
      - Sources/FenestraCLI
      - Sources/Shared
    settings:
      base:
        PRODUCT_NAME: fenestra
        PRODUCT_MODULE_NAME: FenestraCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.florentamaridon.Fenestra.cli
        SKIP_INSTALL: YES
  FenestraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FenestraTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fenestra
schemes:
  Fenestra:
    build:
      targets:
        Fenestra: all
        FenestraTests: [test]
    test:
      targets:
        - FenestraTests
