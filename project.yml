name: Fenestra
options:
  bundleIdPrefix: com.florentamaridon
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MM73SMMT5
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Fenestra:
    type: application
    platform: macOS
    sources:
      - Sources/Fenestra
    info:
      path: Sources/Fenestra/Info.plist
      properties:
        CFBundleDisplayName: Fenestra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florentamaridon.Fenestra
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  FenestraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FenestraTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fenestra
schemes:
  Fenestra:
    build:
      targets:
        Fenestra: all
        FenestraTests: [test]
    test:
      targets:
        - FenestraTests
